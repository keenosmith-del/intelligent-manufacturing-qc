name: Offline ML validation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Unique candidate version
        default: smoke-workflow-v1
        required: true
      epochs:
        description: Maximum epochs on project-owned synthetic smoke data
        default: "35"
        required: true
permissions:
  contents: read
jobs:
  train-export:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ml/src
      TF_CPP_MIN_LOG_LEVEL: "2"
      VERSION: ${{ inputs.version }}
      EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: pytest ml/tests -q
      - run: python -m qc synthetic --count 36
      - run: python -m qc prepare --data data/synthetic --provenance data/synthetic/provenance.json
      - run: python -m qc train --version "$VERSION" --epochs "$EPOCHS"
      - name: Independent package revalidation
        run: python scripts/validate-artifact.py "artifacts/$VERSION" --tensorflow
      - name: Quality and regression checks
        run: python scripts/candidate-gates.py "artifacts/$VERSION/metadata.json" --baseline tests/fixtures/trained/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-package-synthetic
          path: artifacts/
          retention-days: 14
